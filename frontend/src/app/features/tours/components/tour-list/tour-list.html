<section class="col-lg-12 mx-auto px-3 bubble">
  <div class="mb-2 row justify-content-between">
    <div class="col-auto mb-2 mx-4">
      <h2>Tours</h2>
    </div>
    <div class="col-auto mx-4">
      <button class="col-auto btn btn-primary mb-2" (click)="addTour()">Add</button>
    </div>
  </div>
  <!-- search bar -->
  <div class="mb-3 row justify-content-evenly">
    <div class="col-lg-8 mb-2">
      <input
        #query
        type="text"
        class="form-control"
        placeholder="Search tours..."
        [value]="tourFacade.query()"
        (input)="setQuery(query.value)"
      />
    </div>
    <div class="col-auto">
      <button class="btn btn-primary mb-2" (click)="clearQuery()">Clear</button>
    </div>
  </div>

  <!-- tour cards -->
  <div class="tour-list">
    @for (tour of tourFacade.filteredTours(); track tour.id) {
      <div class="bubble-inner card mb-1" (click)="onSelect(tour.id)">
        <div class="card-header">{{ tour.name }}</div>
        <div class="card-body">
          <h5 class="card-title">{{ tour.transport_type }}</h5>
          <p class="card-text">{{ tour.from }} → {{ tour.to }}</p>
        </div>
      </div>
    }
  </div>
</section>
